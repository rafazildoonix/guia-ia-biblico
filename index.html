        :root {
            --azul-principal: #2a6f97;
            --laranja-destaque: #fca311;
            --fundo-claro: #f8f9fa;
            --texto-principal: #343a40;
            --branco: #ffffff;
            --cinza-suave: #e9ecef;
            --fonte-titulos: 'Nunito', sans-serif;
            --fonte-textos: 'Lato', sans-serif;
        }
        body { 
            font-family: var(--fonte-textos );
            line-height: 1.7; 
            margin: 0; 
            padding: 0; 
            background-color: var(--fundo-claro); 
            color: var(--texto-principal); 
        }
        header { 
            background: var(--azul-principal); 
            color: var(--branco); 
            padding: 3rem 1.5rem; 
            text-align: center; 
            border-bottom: 6px solid var(--laranja-destaque);
        }
        h1 { 
            font-family: var(--fonte-titulos);
            font-size: 3rem; 
            font-weight: 800;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        header p {
            font-size: 1.3rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 10px auto 0;
        }
        h2 { 
            font-family: var(--fonte-titulos);
            font-weight: 700;
            color: var(--azul-principal); 
            text-align: center;
            font-size: 2.5rem;
            margin-top: 0;
            margin-bottom: 40px;
        }
        section { 
            padding: 60px 20px; 
            margin: 0 auto;
            max-width: 1100px;
            border-bottom: 1px solid var(--cinza-suave); 
        }
        #problema-solucao, #sobre-mim, #depoimentos {
            background-color: var(--branco);
        }
        #pilares {
            background-color: var(--fundo-claro);
        }
